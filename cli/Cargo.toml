[package]
name = "pi-msgq"
version = "0.1.0"
edition = "2024"
description = "Durable topic-addressed message bus CLI for pi"
license = "MIT OR Apache-2.0"

[[bin]]
name = "msgq"
path = "src/main.rs"

[lib]
name = "msgq"
path = "src/lib.rs"

[dependencies]
honker = "=0.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
ctrlc = "3"
fallible-iterator = "0.2"
postgres = "0.19.14"
sha2 = "0.11.1"
aes-gcm = "0.10"
scrypt = "0.11"
base64 = "0.22"
rand = "0.8"
